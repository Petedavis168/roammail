<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roammail</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#173D56;color:#fff;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  img{width:96px;height:auto;margin-bottom:16px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 24px;opacity:.85}
  button{background:#fff;color:#173D56;border:0;border-radius:24px;padding:12px 28px;font-size:16px;font-weight:600}
</style></head>
<body><main>
  <img src="mark.png" alt="">
  <h1>You're offline</h1>
  <p>Roammail needs an internet connection.<br>Check your Wi-Fi or mobile data and try again.</p>
  <button id="retry">Try again</button>
</main>
<script>
  const go = () => location.replace('https://roammail.net/app');
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
</script>
</body></html>

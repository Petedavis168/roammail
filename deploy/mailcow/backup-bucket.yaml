AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Off-site backups for the mailcow server. Creates a private, encrypted, versioned S3 bucket and an
  IAM user that can ADD backups but cannot delete or overwrite old ones, so a compromised mail server
  cannot wipe its own backups. Old backups move to cheaper storage and expire automatically.

Parameters:
  RetentionDays:
    Type: Number
    Default: 35
    MinValue: 7
    Description: How long to keep each backup
  ColdAfterDays:
    Type: Number
    Default: 7
    MinValue: 1
    Description: Move backups to cheaper storage (Glacier Instant Retrieval) after this many days

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AWS::StackName}-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      LifecycleConfiguration:
        Rules:
          - Id: tiering-and-expiry
            Status: Enabled
            Transitions: [{ StorageClass: GLACIER_IR, TransitionInDays: !Ref ColdAfterDays }]
            ExpirationInDays: !Ref RetentionDays
            NoncurrentVersionExpiration: { NoncurrentDays: !Ref RetentionDays }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 2 }

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TLSOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Bucket.Arn, !Sub '${Bucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  BackupUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: add-backups-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:PutObject', 's3:AbortMultipartUpload', 's3:ListMultipartUploadParts']
                Resource: !Sub '${Bucket.Arn}/mailcow/*'
              - Effect: Allow
                Action: ['s3:ListBucket', 's3:GetBucketLocation', 's3:ListBucketMultipartUploads']
                Resource: !GetAtt Bucket.Arn
              # Read access is only needed to restore; do restores from CloudShell as an admin instead.

Outputs:
  BucketName:
    Value: !Ref Bucket
  BackupUserName:
    Description: Create an access key for this user (IAM console > Users > Security credentials) and put it on the mailcow server
    Value: !Ref BackupUser

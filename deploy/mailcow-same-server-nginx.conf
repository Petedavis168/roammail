# OPTION B: run the app on the SAME machine as mailcow (mailcow's nginx already owns ports 80/443).
#
# 1. In docker-compose.yml remove the "caddy" service and give "app" a port:   ports: ["127.0.0.1:3000:3000"]
# 2. Save this file as  /opt/mailcow-dockerized/data/conf/nginx/webmail.conf  (change server_name)
# 3. Add webmail.yourdomain.com to ADDITIONAL_SAN in mailcow.conf so mailcow gets a certificate for it
# 4. cd /opt/mailcow-dockerized && docker compose up -d && docker compose restart nginx-mailcow
#
# Note: inside the nginx-mailcow container, the host is reachable at the docker bridge gateway (usually 172.22.1.1).
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name webmail.yourdomain.com;

  ssl_certificate /etc/ssl/mail/cert.pem;
  ssl_certificate_key /etc/ssl/mail/key.pem;

  client_max_body_size 30m;

  location / {
    proxy_pass http://172.22.1.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # live updates (Server-Sent Events)
    proxy_read_timeout 1h;
  }
}

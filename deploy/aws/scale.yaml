AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Roammail web app - scale-out layout. A load balancer with a web application firewall in front of
  2+ auto-scaling app servers, a separate background worker, managed PostgreSQL (RDS) and managed Redis
  (ElastiCache). Deployed by deploy/aws/deploy.sh when LAYOUT=scale in config.env.

Parameters:
  AppDomain:
    Type: String
    AllowedPattern: '^[a-z0-9.-]+\.[a-z]{2,}$'
    Description: Web address of the app, e.g. mail.roammail.net
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone that contains AppDomain (needed for the certificate and DNS record)
  InstanceType:
    Type: String
    Default: t3.small
  MinServers:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Web servers always running (2+ means one can fail without downtime)
  MaxServers:
    Type: Number
    Default: 8
    MinValue: 1
  DbInstanceClass:
    Type: String
    Default: db.t4g.small
  DbMultiAz:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Keep a standby database in a second data centre that takes over automatically
  DbStorageGb:
    Type: Number
    Default: 20
    MinValue: 20
  CacheNodeType:
    Type: String
    Default: cache.t4g.micro
  AlertEmail:
    Type: String
    Default: ''
  AlertPhone:
    Type: String
    Default: ''
    AllowedPattern: '^(\+[1-9][0-9]{6,14})?$'
  EnableRoute53Dns:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  ArtifactBucket:
    Type: String
  ReleaseKey:
    Type: String
    Default: releases/latest.tar.gz
    Description: Release to run. deploy.sh sets this to the new version, which rolls the servers one at a time.
  EnvParameterName:
    Type: String
  RequestsPer5MinPerIp:
    Type: Number
    Default: 3000
    MinValue: 100
    Description: Firewall blocks an IP address that sends more requests than this in 5 minutes
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasAlertPhone: !Not [!Equals [!Ref AlertPhone, '']]
  HasAlerts: !Or [!Condition HasAlertEmail, !Condition HasAlertPhone]
  Route53Feature: !Equals [!Ref EnableRoute53Dns, 'true']
  MultiAz: !Equals [!Ref DbMultiAz, 'true']

Resources:
  # ================================================================ network: 2 data centres (availability zones)
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }
  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.0.0/20
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-a' }]
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.16.0/20
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-b' }]
  PrivateA:   # database and Redis only: no route to the internet at all
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.128.0/20
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-data-a' }]
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.144.0/20
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-data-b' }]
  # App servers: no public addresses; they reach mailcow, Stripe etc. through one fixed IP (the NAT gateway),
  # which is the only address mailcow's API allow-list and Fail2ban whitelist need.
  AppA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.64.0/20
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-app-a' }]
  AppB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.80.0/20
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-app-b' }]
  NatIp:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  Nat:
    Type: AWS::EC2::NatGateway
    Properties: { AllocationId: !GetAtt NatIp.AllocationId, SubnetId: !Ref PublicA }
  AppRoutes:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  AppDefault:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref AppRoutes, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref Nat }
  AppARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppA, RouteTableId: !Ref AppRoutes }
  AppBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppB, RouteTableId: !Ref AppRoutes }
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicDefault:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRoutes, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  PublicARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicA, RouteTableId: !Ref PublicRoutes }
  PublicBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicB, RouteTableId: !Ref PublicRoutes }

  # ================================================================ firewalls between the pieces
  LbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: Load balancer - HTTPS from anywhere
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: '::/0' }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: redirect to HTTPS }
  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: App servers - only the load balancer can reach them (no SSH; admin via Session Manager)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref LbSg }
  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: PostgreSQL - app servers only
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSg }
  CacheSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: Redis - app servers only
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 6379, ToPort: 6379, SourceSecurityGroupId: !Ref AppSg }

  # ================================================================ database (PostgreSQL)
  DbSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Roammail database
      SubnetIds: [!Ref PrivateA, !Ref PrivateB]
  DbParams:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres17
      Description: Roammail - encrypted connections only
      Parameters: { rds.force_ssl: '1' }
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '17.9'   # minor updates apply automatically in the maintenance window
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbStorageGb
      MaxAllocatedStorage: 500          # grows automatically when it fills up
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !If [MultiAz, true, false]
      DBName: roammail
      MasterUsername: roammail
      ManageMasterUserPassword: true    # password generated and rotated in Secrets Manager; nobody sees it
      DBSubnetGroupName: !Ref DbSubnets
      DBParameterGroupName: !Ref DbParams
      VPCSecurityGroups: [!Ref DbSg]
      PubliclyAccessible: false
      BackupRetentionPeriod: 14         # point-in-time restore to any second in the last 14 days
      CopyTagsToSnapshot: true
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: true
      PreferredBackupWindow: '03:00-03:30'
      PreferredMaintenanceWindow: 'sun:04:00-sun:05:00'

  # ================================================================ Redis (shared rate limits, sign-out everywhere)
  CacheSubnets:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Roammail Redis
      SubnetIds: [!Ref PrivateA, !Ref PrivateB]
  Cache:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: Roammail shared state
      Engine: redis
      CacheNodeType: !Ref CacheNodeType
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      CacheSubnetGroupName: !Ref CacheSubnets
      SecurityGroupIds: [!Ref CacheSg]

  # ================================================================ HTTPS certificate + load balancer
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref AppDomain
      ValidationMethod: DNS
      DomainValidationOptions: [{ DomainName: !Ref AppDomain, HostedZoneId: !Ref HostedZoneId }]
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: [!Ref PublicA, !Ref PublicB]
      SecurityGroups: [!Ref LbSg]
      IpAddressType: dualstack
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: '120' }               # live updates stream
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: routing.http.desync_mitigation_mode, Value: strictest }
        - { Key: deletion_protection.enabled, Value: 'true' }
  AppTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 3000
      TargetType: instance
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref Certificate }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref AppTargets }]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions: [{ Type: redirect, RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 } }]
  DnsRecord:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - { Name: !Ref AppDomain, Type: A, AliasTarget: { DNSName: !GetAtt LoadBalancer.DNSName, HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID } }
        - { Name: !Ref AppDomain, Type: AAAA, AliasTarget: { DNSName: !GetAtt LoadBalancer.DNSName, HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID } }

  # ================================================================ web application firewall
  Firewall:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${AWS::StackName}-firewall'
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: !Sub '${AWS::StackName}-waf' }
      Rules:
        - Name: rate-limit-per-ip
          Priority: 0
          Action: { Block: {} }
          Statement: { RateBasedStatement: { Limit: !Ref RequestsPer5MinPerIp, AggregateKeyType: IP } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate-limit }
        - Name: aws-ip-reputation        # known botnets, scanners and attackers
          Priority: 1
          OverrideAction: { None: {} }
          Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ip-reputation }
        - Name: aws-common
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # Emails with attachments and rich HTML are large and contain markup by design; the app checks those itself
              RuleActionOverrides:
                - { Name: SizeRestrictions_BODY, ActionToUse: { Count: {} } }
                - { Name: CrossSiteScripting_BODY, ActionToUse: { Count: {} } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common }
        - Name: aws-known-bad-inputs
          Priority: 3
          OverrideAction: { None: {} }
          Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: bad-inputs }
        - Name: aws-sql-injection
          Priority: 4
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
              RuleActionOverrides: [{ Name: SQLi_BODY, ActionToUse: { Count: {} } }]   # email bodies can contain anything
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: sqli }
  FirewallAttach:
    Type: AWS::WAFv2::WebACLAssociation
    Properties: { ResourceArn: !Ref LoadBalancer, WebACLArn: !GetAtt Firewall.Arn }

  # ================================================================ app servers
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${AWS::StackName}/app'
      RetentionInDays: 30
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: s3:GetObject, Resource: !Sub 'arn:aws:s3:::${ArtifactBucket}/releases/*' }
              - { Effect: Allow, Action: ssm:GetParameter, Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnvParameterName}' }
              - { Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !GetAtt Database.MasterUserSecret.SecretArn }
              - { Effect: Allow, Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams], Resource: !Sub '${LogGroup.Arn}:*' }
        - !If
          - Route53Feature
          - PolicyName: route53-customer-dns
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - { Effect: Allow, Action: [route53:ListHostedZonesByName, route53:ListResourceRecordSets, route53:ChangeResourceRecordSets, route53:GetChange], Resource: '*' }
          - !Ref AWS::NoValue
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref InstanceRole] }

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmi
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!Ref AppSg]
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2, InstanceMetadataTags: enabled }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-app' }]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Each server is disposable: it builds the release and joins the load balancer. Nothing is stored on it.
            set -euo pipefail
            exec > /var/log/roammail-setup.log 2>&1
            dnf install -y docker python3
            systemctl enable --now docker
            TOKEN="$(curl -fsS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)"
            ROLE="$(curl -fsS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/tags/instance/role || echo web)"
            case "$ROLE" in web|worker) ;; *) ROLE=web ;; esac
            mkdir -p /opt/roammail/app /opt/roammail/data && cd /opt/roammail
            aws s3 cp "s3://${ArtifactBucket}/${ReleaseKey}" release.tar.gz --region ${AWS::Region}
            tar -xzf release.tar.gz -C app
            curl -fsS -o data/rds-ca.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
            aws ssm get-parameter --region ${AWS::Region} --name '${EnvParameterName}' --with-decryption --query Parameter.Value --output text > app/.env
            SECRET="$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id '${Database.MasterUserSecret.SecretArn}' --query SecretString --output text)"
            DBURL="$(python3 -c 'import json,sys,urllib.parse as u; s=json.loads(sys.argv[1]); print("postgres://%s:%s@${Database.Endpoint.Address}:${Database.Endpoint.Port}/roammail" % (u.quote(s["username"],safe=""), u.quote(s["password"],safe="")))' "$SECRET")"
            {
              echo "DATABASE_URL=$DBURL"
              echo "REDIS_URL=rediss://${Cache.PrimaryEndPoint.Address}:${Cache.PrimaryEndPoint.Port}"
              echo "ROLE=$ROLE"
              echo "TRUST_PROXY=1"
              echo "COOKIE_SECURE=true"
              echo "NODE_EXTRA_CA_CERTS=/data/rds-ca.pem"
              echo "METRICS_NAMESPACE=${AWS::StackName}"
            } >> app/.env
            chmod 600 app/.env
            cd app
            docker build -t roammail .
            docker run -d --name app --restart unless-stopped --env-file .env -p 3000:3000 \
              --read-only --tmpfs /tmp:size=64m --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 512 \
              -v /opt/roammail/data:/data \
              --log-driver awslogs --log-opt awslogs-region=${AWS::Region} --log-opt awslogs-group=${LogGroup} --log-opt tag="$ROLE-{{.ID}}" \
              roammail
            for _ in $(seq 1 60); do curl -fsS localhost:3000/healthz && exit 0; sleep 5; done
            echo "app did not start" >&2; exit 1

  WebServers:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: [AppDefault]
    UpdatePolicy:
      AutoScalingRollingUpdate:      # new release: replace servers one at a time, never dropping below MinServers
        MinInstancesInService: !Ref MinServers
        MaxBatchSize: 1
        PauseTime: PT10M
        WaitOnResourceSignals: false
    Properties:
      VPCZoneIdentifier: [!Ref AppA, !Ref AppB]
      LaunchTemplate: { LaunchTemplateId: !Ref LaunchTemplate, Version: !GetAtt LaunchTemplate.LatestVersionNumber }
      MinSize: !Ref MinServers
      MaxSize: !Ref MaxServers
      TargetGroupARNs: [!Ref AppTargets]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 600
      Tags:
        - { Key: role, Value: web, PropagateAtLaunch: true }
  ScaleOnCpu:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WebServers
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification: { PredefinedMetricType: ASGAverageCPUUtilization }
        TargetValue: 55

  # One background worker: scheduled sends, snoozes, billing checks, clean-up. Replaced automatically if it fails.
  Worker:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: [AppDefault]
    UpdatePolicy:
      AutoScalingRollingUpdate: { MinInstancesInService: 0, MaxBatchSize: 1 }
    Properties:
      VPCZoneIdentifier: [!Ref AppA, !Ref AppB]
      LaunchTemplate: { LaunchTemplateId: !Ref LaunchTemplate, Version: !GetAtt LaunchTemplate.LatestVersionNumber }
      MinSize: 1
      MaxSize: 1
      Tags:
        - { Key: role, Value: worker, PropagateAtLaunch: true }

  # ================================================================ alerts and dashboard
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlerts
    Properties: { TopicName: !Sub '${AWS::StackName}-alerts' }
  AlertEmailSub:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties: { TopicArn: !Ref AlertTopic, Protocol: email, Endpoint: !Ref AlertEmail }
  AlertPhoneSub:
    Type: AWS::SNS::Subscription
    Condition: HasAlertPhone
    Properties: { TopicArn: !Ref AlertTopic, Protocol: sms, Endpoint: !Ref AlertPhone }
  UnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlerts
    Properties:
      AlarmDescription: An app server is failing health checks
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt AppTargets.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertTopic]
  Lb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlerts
    Properties:
      AlarmDescription: 20+ failed requests (5xx) at the load balancer in 5 minutes
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  SlowAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlerts
    Properties:
      AlarmDescription: Slow responses - 95% of requests took over 2 seconds for 10 minutes
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlerts
    Properties:
      AlarmDescription: Database CPU above 80% for 15 minutes - consider a bigger DbInstanceClass
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertTopic]
  DbStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlerts
    Properties:
      AlarmDescription: Database has less than 2 GB free
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2000000000
      ComparisonOperator: LessThanThreshold
      AlarmActions: [!Ref AlertTopic]
  ErrorMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"APP_ERROR"'
      MetricTransformations: [{ MetricNamespace: !Sub '${AWS::StackName}', MetricName: AppErrors, MetricValue: '1', DefaultValue: 0 }]
  LockoutMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"SECURITY_LOCKOUT"'
      MetricTransformations: [{ MetricNamespace: !Sub '${AWS::StackName}', MetricName: LoginLockouts, MetricValue: '1', DefaultValue: 0 }]
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlerts
    DependsOn: ErrorMetric
    Properties:
      AlarmDescription: The app logged 5+ unexpected errors in 5 minutes
      Namespace: !Sub '${AWS::StackName}'
      MetricName: AppErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  LockoutAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlerts
    DependsOn: LockoutMetric
    Properties:
      AlarmDescription: Possible password-guessing attack - 10+ sign-in lockouts in 15 minutes
      Namespace: !Sub '${AWS::StackName}'
      MetricName: LoginLockouts
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}'
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Requests and errors","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/ApplicationELB","RequestCount","LoadBalancer","${LoadBalancer.LoadBalancerFullName}"],[".","HTTPCode_Target_5XX_Count",".","."]]}},
          {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Response time p95 (s)","region":"${AWS::Region}","stat":"p95","period":60,"metrics":[["AWS/ApplicationELB","TargetResponseTime","LoadBalancer","${LoadBalancer.LoadBalancerFullName}"]]}},
          {"type":"metric","x":0,"y":6,"width":8,"height":6,"properties":{"title":"Healthy app servers","region":"${AWS::Region}","stat":"Minimum","period":60,"metrics":[["AWS/ApplicationELB","HealthyHostCount","LoadBalancer","${LoadBalancer.LoadBalancerFullName}","TargetGroup","${AppTargets.TargetGroupFullName}"]]}},
          {"type":"metric","x":8,"y":6,"width":8,"height":6,"properties":{"title":"Database CPU % / connections","region":"${AWS::Region}","stat":"Average","period":300,"metrics":[["AWS/RDS","CPUUtilization","DBInstanceIdentifier","${Database}"],[".","DatabaseConnections",".","."]]}},
          {"type":"metric","x":16,"y":6,"width":8,"height":6,"properties":{"title":"Firewall blocked requests","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/WAFV2","BlockedRequests","WebACL","${AWS::StackName}-firewall","Region","${AWS::Region}","Rule","ALL"]]}},
          {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"People online / signed in","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["${AWS::StackName}","live_users"],[".","sessions_active",{"stat":"Maximum"}]]}},
          {"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{"title":"Errors and sign-in lockouts","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["${AWS::StackName}","AppErrors"],[".","LoginLockouts"]]}}
        ]}

Outputs:
  AppUrl:
    Value: !Sub 'https://${AppDomain}'
  StatusPage:
    Value: !Sub 'https://${AppDomain}/status'
  DashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}'
  LoadBalancerDns:
    Value: !GetAtt LoadBalancer.DNSName
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  OutboundIp:
    Description: Add this IP to mailcow's API allow-list and Fail2ban whitelist
    Value: !Ref NatIp

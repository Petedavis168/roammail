# Production: app + Caddy (automatic HTTPS via Let's Encrypt).
# 1) cp .env.example .env  and fill it in   2) docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # Hardening: read-only filesystem (data only in /data), no Linux capabilities, no privilege escalation
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g
    volumes:
      - appdata:/data
    expose:
      - "3000"

  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  appdata:
  caddy_data:
  caddy_config:

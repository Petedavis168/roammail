name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly, catches newly published vulnerabilities

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      greenmail:
        image: greenmail/standalone:2.1.2
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users.login=email
        ports: ['3025:3025', '3143:3143', '8080:8080']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Dependency audit (fails on high/critical)
        run: |
          npm audit --prefix server --omit=dev --audit-level=high
          npm audit --prefix client --audit-level=high

      - name: Build web app
        run: npm run build --prefix client

      - name: Unit tests
        run: npm test --prefix server

      - name: Start test stack (mock mailcow, mock Stripe, Radicale CalDAV/CardDAV, app)
        working-directory: server
        run: |
          pip install radicale
          mkdir -p "$RUNNER_TEMP/radicale"
          printf '[server]\nhosts = 127.0.0.1:5232\n[auth]\ntype = none\n[storage]\nfilesystem_folder = %s/radicale/collections\n[rights]\ntype = owner_only\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/radicale/config"
          TMPDIR=$RUNNER_TEMP dev/start-stack.sh "$RUNNER_TEMP/radicale/config"
          curl -sf localhost:3000/healthz

      - name: API security tests
        run: npm run test:api --prefix server

      - name: Calendar and contacts tests
        run: npm run test:workspace --prefix server

      - name: Billing and groups tests
        run: npm run test:billing --prefix server

      - name: Browser injection tests
        working-directory: server
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Logs on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/app.log" "$RUNNER_TEMP/mock.log" "$RUNNER_TEMP/stripe.log"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t mail-client:ci .
      - name: Image runs as non-root on a read-only filesystem
        run: |
          docker run -d --name app --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e SESSION_SECRET=ci -e DATA_DIR=/data -v appdata:/data -p 3000:3000 mail-client:ci
          for _ in $(seq 1 20); do curl -sf localhost:3000/healthz && break; sleep 1; done
          curl -sf localhost:3000/healthz
          test "$(docker exec app id -u)" = "1000"

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Lint CloudFormation and deploy script
        run: |
          pip install cfn-lint shellcheck-py
          cfn-lint deploy/aws/template.yaml deploy/aws/scale.yaml deploy/mailcow/backup-bucket.yaml
          shellcheck -S warning deploy/aws/deploy.sh deploy/aws/user-data.sh deploy/mailcow/*.sh

  # Same app on PostgreSQL + Redis with two servers side by side (the load-balanced setup)
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      greenmail:
        image: greenmail/standalone:2.1.2
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users.login=email
        ports: ['3025:3025', '3143:3143', '8080:8080']
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Start server A (all roles) and server B (web only) on PostgreSQL + Redis
        working-directory: server
        env:
          PG_ADMIN_URL: postgres://postgres@127.0.0.1:5433
          REDIS_URL: redis://127.0.0.1:6380
        run: |
          pip install radicale
          mkdir -p "$RUNNER_TEMP/radicale"
          printf '[server]\nhosts = 127.0.0.1:5232\n[auth]\ntype = none\n[storage]\nfilesystem_folder = %s/radicale/collections\n[rights]\ntype = owner_only\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/radicale/config"
          TMPDIR=$RUNNER_TEMP dev/start-stack.sh "$RUNNER_TEMP/radicale/config"
          DB=$(psql "$PG_ADMIN_URL/postgres" -Atc "select datname from pg_database where datname like 'roammail_%' order by datname desc limit 1")
          PORT=3002 ROLE=web DATABASE_URL="$PG_ADMIN_URL/$DB" DATA_DIR="$RUNNER_TEMP/b" nohup node --env-file=dev/test.env src/index.js > "$RUNNER_TEMP/appB.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf localhost:3002/healthz && break; sleep 1; done
      - name: API tests (PostgreSQL)
        run: npm run test:api --prefix server
      - name: Billing and groups tests (PostgreSQL)
        run: npm run test:billing --prefix server
      - name: Cross-server tests
        working-directory: server
        run: node --test test/multiserver.test.js
      - name: Logs on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/app.log" "$RUNNER_TEMP/appB.log"

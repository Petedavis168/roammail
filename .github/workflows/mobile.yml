# Builds the Roammail phone apps and (optionally) uploads them to Google Play and App Store Connect (TestFlight).
# Run it from GitHub: Actions > "Mobile apps" > Run workflow. Setup and the secrets it uses: docs/MOBILE_APPS.md.
name: Mobile apps

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to Google Play (internal testing) and TestFlight
        type: boolean
        default: false
      platforms:
        description: Which apps to build
        type: choice
        options: [both, android, ios]
        default: both
  push:
    tags: ['mobile-v*'] # e.g. mobile-v1.0.0: build and upload both apps
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  UPLOAD: ${{ github.event_name == 'push' || inputs.upload == true }}
  APP_VERSION_CODE: ${{ github.run_number }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run check

  android:
    needs: check
    if: github.event_name != 'workflow_dispatch' || inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: echo "APP_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npx cap sync android
      - name: Firebase config (push notifications)
        if: env.HAS_FIREBASE == 'true'
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        env: { GOOGLE_SERVICES_JSON: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
      - name: Upload key
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
      - name: Build (Play bundle + installable APK)
        working-directory: mobile/android
        run: ./gradlew --no-daemon bundleRelease assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Test build anyone can install (until the Play upload key is set up)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE != 'true'
        with:
          name: roammail-android-TEST-install-me-${{ env.APP_VERSION_NAME }}-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: roammail-android-${{ env.APP_VERSION_NAME }}-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
      - name: Upload to Google Play (internal testing)
        if: env.UPLOAD == 'true' && env.HAS_PLAY == 'true' && env.HAS_KEYSTORE == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.roammail.app
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  ios:
    needs: check
    if: github.event_name != 'workflow_dispatch' || inputs.platforms != 'android'
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: echo "APP_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npx cap sync ios
      - name: Compile check (no signing)
        if: env.HAS_ASC != 'true'
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -n 20
      - name: App Store Connect key
        if: env.HAS_ASC == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
        env: { ASC_KEY_P8: '${{ secrets.ASC_KEY_P8 }}' }
      - name: Archive (signed automatically with the App Store Connect key)
        if: env.HAS_ASC == 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$APP_VERSION_NAME" CURRENT_PROJECT_VERSION="$APP_VERSION_CODE" \
            archive | tail -n 30
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Export (and upload to TestFlight)
        if: env.HAS_ASC == 'true'
        run: |
          DEST=export; [ "$UPLOAD" = "true" ] && DEST=upload
          sed -e "s/TEAM_ID/$TEAM_ID/" -e "s/DESTINATION/$DEST/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        if: env.HAS_ASC == 'true'
        with:
          name: roammail-ios-${{ env.APP_VERSION_NAME }}-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa
          if-no-files-found: ignore
